name: Deploy ms-rabbit-admin

on:
  push:
    branches:
      - deploy

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Crear carpeta remota
        run: |
          ssh -i ~/.ssh/ec2_key \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "mkdir -p ~/cloudnative/ms-rabbit-admin"

      - name: Copiar proyecto a EC2
        run: |
          scp -i ~/.ssh/ec2_key -r \
            Dockerfile \
            .dockerignore \
            pom.xml \
            src \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/cloudnative/ms-rabbit-admin/"

      - name: Desplegar ms-rabbit-admin
        run: |
          ssh -i ~/.ssh/ec2_key \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'

          cd ~/cloudnative/ms-rabbit-admin

          docker build -t ms-rabbit-admin .

          docker rm -f ms-rabbit-admin || true

          docker run -d \
            --name ms-rabbit-admin \
            --restart unless-stopped \
            --network cloudnative-network \
            -p 8084:8084 \
            --env-file ~/cloudnative/rabbit-admin.env \
            ms-rabbit-admin

          docker image prune -f

          EOF